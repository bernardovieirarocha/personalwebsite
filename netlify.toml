[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # O painel da Netlify ainda tem @netlify/plugin-nextjs instalado, heranca do
  # site antigo. Este site e Vite + vite-react-ssg, entao o plugin procura um
  # build de Next em dist/, nao acha e derruba o deploy DEPOIS do build ter dado
  # certo. Plugin instalado pela UI nao pode ser removido pelo netlify.toml, e
  # esta variavel e a saida documentada pelo proprio erro.
  # Quando o plugin for removido no painel, esta linha pode sair.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# O build é pré-renderizado (vite-react-ssg): cada rota vira um HTML estático
# em dist/, então NÃO existe mais um rewrite "/* -> /index.html 200".
# Um caminho inexistente cai no 404 real abaixo, como deve ser.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Fontes auto-hospedadas (src/index.css). O nome do arquivo não tem hash, então
# a regra é: trocou a fonte, troca o nome do arquivo. Sem isso elas caem no
# cache padrão do Netlify e voltam a ser baixadas a cada visita, o que anula
# boa parte do ganho de ter saído do Google Fonts.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Avatar do hero (candidato a LCP) e logo. Mesma regra de nome acima, mas com
# prazo menor: é mais provável trocar a foto que a fonte.
[[headers]]
  for = "/avatar.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/bernardologo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Capturas dos projetos. Mesma regra de nome dos arquivos acima: trocou a
# imagem, troca o nome (ou aceite até uma semana de cache antigo).
[[headers]]
  for = "/projects/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
