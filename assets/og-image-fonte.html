<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<style>
  @font-face{font-family:"Archivo";src:url("../public/fonts/archivo-latin.woff2") format("woff2");font-weight:100 900;font-display:block}
  @font-face{font-family:"JetBrains Mono";src:url("../public/fonts/jetbrains-mono-latin.woff2") format("woff2");font-weight:100 800;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{
    background:hsl(220 20% 4%);
    color:hsl(210 30% 97%);
    font-family:"Archivo",sans-serif;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:72px 80px;
    position:relative;overflow:hidden;
  }
  /* traços de circuito, o mesmo efeito característico do site, bem discreto */
  .traces{position:absolute;inset:0;opacity:.16}
  .name{font-size:82px;font-weight:700;letter-spacing:-.03em;line-height:1;position:relative}
  .rule{width:96px;height:3px;background:hsl(185 52% 58%);margin:26px 0 24px;position:relative}
  .role{font-size:29px;font-weight:500;color:hsl(210 30% 97%);line-height:1.35;position:relative;max-width:820px}
  .work{font-family:"JetBrains Mono",monospace;font-size:19px;color:hsl(215 15% 60%);line-height:1.75;position:relative;letter-spacing:.01em}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;position:relative}
  .site{font-family:"JetBrains Mono",monospace;font-size:22px;color:hsl(185 52% 58%);letter-spacing:.02em}
</style></head><body>
<svg class="traces" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
  <g stroke="hsl(185 52% 58%)" stroke-width="1.5">
    <path d="M880 0 v120 l70 70 v180"/>
    <path d="M980 0 v60 l-70 70 v250 l90 90 v160"/>
    <path d="M1090 0 v220 l-60 60 v350"/>
    <path d="M1200 300 h-140 l-70 70"/>
    <path d="M1200 470 h-90 l-60 -60"/>
  </g>
  <g fill="hsl(185 52% 58%)">
    <circle cx="950" cy="190" r="5"/><circle cx="910" cy="130" r="5"/>
    <circle cx="1030" cy="280" r="5"/><circle cx="1000" cy="470" r="5"/>
    <circle cx="1050" cy="410" r="5"/>
  </g>
</svg>
<div>
  <div class="name">Bernardo Rocha</div>
  <div class="rule"></div>
  <div class="role">Engenharia de Computação no CEFET-MG</div>
</div>
<div class="foot">
  <div class="work">
    Eletrônica embarcada e telemetria · Fórmula CEFAST<br>
    Dados, backend e infraestrutura
  </div>
  <div class="site">bernardorocha.com</div>
</div>
</body></html>
