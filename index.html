<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" sizes="any" href="/favicon.ico" />
    <link rel="icon" type="image/webp" href="/bernardologo.webp" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <meta name="author" content="Bernardo Vieira Rocha" />
    <meta name="theme-color" content="#0a0d12" />

    <!-- A fonte de texto é o que atrasa o primeiro texto legível em toda
         rota; sem preload ela só começa a baixar depois do CSS ser parseado.
         É same-origin (nada de fonts.gstatic aqui), então não abre conexão
         nova. O avatar é preloadado só na home, via Seo.tsx: o /resume não
         mostra avatar e não deve baixá-lo. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- NÃO adicione <title>, description, canonical nem og:*/twitter:* aqui.
         Eles são definidos por rota em src/components/Seo.tsx e injetados no
         HTML estático durante o build; declarar de novo gera tags duplicadas. -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Bernardo Vieira Rocha",
        "alternateName": "Bernardo Rocha",
        "url": "https://bernardorocha.com/",
        "image": "https://bernardorocha.com/og-image.png",
        "email": "mailto:b.vieira.rocha@gmail.com",
        "jobTitle": "Projetista Eletrônico",
        "worksFor": {
          "@type": "Organization",
          "name": "Fórmula CEFAST"
        },
        "alumniOf": [
          {
            "@type": "CollegeOrUniversity",
            "name": "Centro Federal de Educação Tecnológica de Minas Gerais (CEFET-MG)"
          }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Belo Horizonte",
          "addressRegion": "MG",
          "addressCountry": "BR"
        },
        "knowsAbout": [
          "Sistemas embarcados",
          "Projeto de PCB",
          "Telemetria veicular",
          "Barramento CAN",
          "Infraestrutura e DevOps",
          "Engenharia de software"
        ],
        "sameAs": [
          "https://github.com/bernardovieirarocha",
          "https://www.linkedin.com/in/bernardovrocha/"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
